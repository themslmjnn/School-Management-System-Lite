[pytest]
pythonpath = . src
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
env =
    ENVIRONMENT=test
    DB_HOST=localhost
    DB_PORT=5432
    DB_USER=postgres
    DB_PSSW=musleno
    DB_NAME=StudentGradeManagerTestDB
    JWT_SECRET_KEY=2da3f8d3d955678600e1f346532d681bc39853c8bae90618601d45d9d86c645c
    REDIS_HOST=localhost
    REDIS_PORT=6379
    REDIS_PASSWORD=
    REDIS_DB=1
markers =
    db_constraint: test bypasses the service layer to verify a database-level
        constraint (e.g. a partial unique index) directly.